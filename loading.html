  <style>
  :root { color-scheme: dark; --ink:#f0eee3; --muted:#aab4a7; --amber:#ff7b38; --teal:#72d0bc; --panel:#101c19; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#0c1714; color:var(--ink); font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif; }
  #canvas { display:block; width:100%; height:100%; outline:none; }
  #loading { position:fixed; inset:0; display:grid; place-content:center; justify-items:center; gap:13px; padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left)); background:radial-gradient(ellipse at 70% 45%,#19332c 0%,#101e1a 39%,#0b1412 78%); text-align:center; }
  #loading::before { content:""; position:absolute; inset:clamp(14px,3vw,36px); border:1px solid rgba(114,208,188,.22); pointer-events:none; }
  #loading[hidden],[hidden] { display:none; }
  #game-icon { width:76px; height:76px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(255,123,56,.28)); }
  h1 { margin:3px 0 0; font-size:clamp(27px,6vw,48px); line-height:1.05; font-weight:800; letter-spacing:.12em; color:#f4eee0; text-shadow:0 3px 24px rgba(255,123,56,.26); }
  p { margin:0; color:var(--muted); font-size:clamp(13px,2.1vw,16px); }
  #loading-status { min-height:1.4em; color:var(--teal); letter-spacing:.04em; }
  progress { width:min(360px,76vw); height:8px; justify-self:center; overflow:hidden; border:0; border-radius:99px; background:#263932; accent-color:var(--amber); }
  progress::-webkit-progress-bar { background:#263932; border-radius:99px; }
  progress::-webkit-progress-value { background:linear-gradient(90deg,var(--teal),var(--amber)); border-radius:99px; }
  progress::-moz-progress-bar { background:linear-gradient(90deg,var(--teal),var(--amber)); border-radius:99px; }

        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = 'Preparando la arena…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? 'Iniciando Última Ronda…'
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await ManusAuth.startGame(() => engine.startGame({ onProgress }));
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
